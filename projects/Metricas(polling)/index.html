<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - Hackathon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { transition: all 0.3s ease; }
    </style>
</head>
<body class="p-8 font-sans relative min-h-screen">

    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-gray-700 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-bold">Estado de los Sistemas</h1>
                <p class="text-gray-400 text-sm mt-1">Monitoreo en tiempo real (Polling cada 2s)</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAuditDrawer()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-sm font-semibold transition flex items-center gap-2">
                    <span>🔍</span> Trazabilidad / Logs
                </button>
                <div id="global-status" class="px-4 py-2 rounded-full font-bold bg-green-500/20 text-green-400 border border-green-500 text-sm">
                    Todos los sistemas operacionales
                </div>
            </div>
        </header>

        <!-- Grid de Servicios -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="services-grid">
            <!-- Se llena con JS -->
        </div>
    </div>

    <!-- Drawer Lateral para Trazabilidad y Logs -->
    <div id="audit-drawer" class="fixed top-0 right-0 w-full md:w-[480px] h-full bg-slate-900 border-l border-slate-700 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/80 backdrop-blur">
            <div>
                <h2 class="text-lg font-bold text-white">Auditoría y Trazabilidad</h2>
                <p class="text-xs text-slate-400">Eventos del sistema e incidencias en vivo</p>
            </div>
            <button onclick="toggleAuditDrawer()" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
        </div>
        <div id="logs-container" class="p-4 space-y-3 overflow-y-auto flex-1 font-mono text-xs">
            <!-- Se llena dinámicamente con logs -->
        </div>
    </div>

    <script>
        const grid = document.getElementById('services-grid');
        const globalStatus = document.getElementById('global-status');
        const auditDrawer = document.getElementById('audit-drawer');
        const logsContainer = document.getElementById('logs-container');

        // Enviar traza al backend
        function logUXEvent(action, details = {}) {
            fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    timestamp: new Date().toISOString(),
                    action: action,
                    url: window.location.href,
                    userAgent: navigator.userAgent,
                    details: details
                })
            }).catch(() => {});
        }

        function toggleAuditDrawer() {
            auditDrawer.classList.toggle('translate-x-full');
            if (!auditDrawer.classList.contains('translate-x-full')) {
                logUXEvent('OPEN_LOGS_DRAWER');
                fetchLogs();
            }
        }

        function getStatusColor(status) {
            if (status === 'OPERATIONAL') return 'bg-green-900/30 border-green-500 text-green-400';
            if (status === 'DEGRADED') return 'bg-yellow-900/30 border-yellow-500 text-yellow-400';
            if (status === 'OUTAGE') return 'bg-red-900/30 border-red-500 text-red-400';
            return 'bg-gray-800 border-gray-600';
        }

        async function fetchMetrics() {
            try {
                const res = await fetch('/api/metrics');
                const data = await res.json();
                
                grid.innerHTML = '';
                let hasIncidents = false;

                for (const [serviceName, metrics] of Object.entries(data)) {
                    if (metrics.status !== 'OPERATIONAL') hasIncidents = true;

                    const metricHtml = Object.entries(metrics)
                        .filter(([k]) => k !== 'status')
                        .map(([k, v]) => `<div class="flex justify-between text-sm"><span class="text-gray-400 capitalize">${k.replace(/_/g, ' ')}:</span> <span class="font-mono font-bold">${v}</span></div>`)
                        .join('');

                    const card = `
                        <div class="card p-5 rounded-xl border-2 ${getStatusColor(metrics.status)}">
                            <div class="flex justify-between items-center mb-4 border-b border-current pb-2">
                                <h2 class="text-xl font-bold uppercase tracking-wider">${serviceName}</h2>
                                <span class="text-xs font-black px-2 py-1 rounded bg-current text-white mix-blend-overlay">${metrics.status}</span>
                            </div>
                            <div class="space-y-2">
                                ${metricHtml}
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                }

                if (hasIncidents) {
                    globalStatus.className = 'px-4 py-2 rounded-full font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500 text-sm';
                    globalStatus.innerText = '⚠️ Incidencias Activas Detectadas';
                } else {
                    globalStatus.className = 'px-4 py-2 rounded-full font-bold bg-green-500/20 text-green-400 border border-green-500 text-sm';
                    globalStatus.innerText = '✓ Todos los sistemas operacionales';
                }

            } catch (error) {
                logUXEvent('METRICS_FETCH_ERROR', { error: error.message });
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs/stream');
                const logs = await res.json();
                
                logsContainer.innerHTML = logs.map(log => {
                    const isError = log.level === 'ERROR' || log.level === 'WARNING';
                    const badgeColor = log.level === 'ERROR' ? 'bg-red-500/20 text-red-400 border-red-500' :
                                       log.level === 'WARNING' ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500' : 
                                       'bg-blue-500/20 text-blue-400 border-blue-500';

                    return `
                        <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700 space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badgeColor}">${log.level}</span>
                                <span class="text-slate-500 text-[10px]">${log.timestamp}</span>
                            </div>
                            <div class="text-slate-200 font-semibold">${log.audit ? log.audit.event : log.message}</div>
                            <div class="text-slate-400 text-[11px] break-all bg-slate-900/50 p-1.5 rounded border border-slate-800">
                                ${JSON.stringify(log.audit || {})}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("Error al obtener logs", err);
            }
        }

        // Inicialización y Polling
        document.addEventListener('DOMContentLoaded', () => {
            logUXEvent('PAGE_LOAD');
            fetchMetrics();
            fetchLogs();
            setInterval(fetchMetrics, 2000);
            setInterval(fetchLogs, 2000);
        });
    </script>
</body>
</html>
